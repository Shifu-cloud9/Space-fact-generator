<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cosmic Facts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="masthead">
            <h1>Cosmic Facts</h1>
            <p class="subtitle">A running record of the observable universe</p>
        </header>

        <div class="stars" aria-hidden="true">✦</div>

        <section class="entry">

            <div class="fact-box">
                <p id="fact">
                    Select the button to reveal an entry.
                </p>
            </div>

            <button id="generateButton">
                Draw another fact
            </button>

            <p id="status"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
