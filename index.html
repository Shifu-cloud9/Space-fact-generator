<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cosmic Facts</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="stars">✦ ✧ ✦</div>

        <h1>Cosmic Facts</h1>

        <p class="subtitle">
            One random fact from the universe.
        </p>

        <div class="fact-box">
            <p id="fact">
                Click the button to discover something about space.
            </p>
        </div>

        <button id="generateButton">
            🌌 Give me a space fact
        </button>

        <p id="status"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
